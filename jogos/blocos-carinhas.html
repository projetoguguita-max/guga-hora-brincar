<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#F5EDD8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Guga e Papai">
<meta name="description" content="Blocos e Carinhas — pinte blocos, cole carinhas e plaquinhas de número. Projeto Guguita.">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../assets/img/capa-guga.jpg">
<title>Blocos e Carinhas — Projeto Guguita</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800;900&family=Nunito:wght@600;700;800;900&display=swap');
:root{
  --creme:#F5EDD8;--branco:#FFFDF8;--bege:#E8D9B8;--bege-esc:#C8B890;--marrom:#8B5E3C;
  --azul:#2F7FC0;--azul-claro:#5BA8E0;--azul-esc:#1A5A90;--verde:#4A9B6F;--verde-esc:#236b45;
  --vermelho:#C84040;--laranja:#D4733A;--amarelo:#E8B840;--anil:#3752A3;--roxo:#7C5AC7;--rosa:#D963A5;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:linear-gradient(180deg,var(--creme),#efe3c4);
  color:var(--marrom);font-family:Nunito,system-ui,sans-serif;
  padding:10px;touch-action:manipulation;
}
.app{width:min(1120px,100%);height:calc(100dvh - 20px);margin:0 auto;display:grid;grid-template-rows:auto 1fr;gap:10px}
.topo{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px}
.voltar{
  display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 15px;border-radius:14px;
  background:var(--branco);border:3px solid var(--bege-esc);box-shadow:0 4px 0 var(--bege-esc);
  color:var(--marrom);font-family:"Baloo 2",Nunito,sans-serif;font-weight:900;font-size:16px;text-decoration:none;
}
.voltar:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bege-esc)}
.titulo{margin:0;font-family:"Baloo 2",Nunito,sans-serif;font-size:clamp(22px,4vw,38px);line-height:.95}
.titulo span{color:var(--rosa)}
button{border:0;cursor:pointer;font-family:Nunito,system-ui,sans-serif;font-weight:900;color:var(--branco);
  transition:transform .1s ease,box-shadow .1s ease,filter .1s ease;-webkit-tap-highlight-color:transparent}
button:active{transform:translateY(3px);box-shadow:none}
button:disabled{cursor:default;opacity:.5;filter:saturate(.7);transform:none}
.btn{min-height:52px;padding:0 16px;border-radius:15px;font-size:17px;white-space:nowrap}
.btn-azul{background:linear-gradient(180deg,var(--azul-claro),var(--azul));box-shadow:0 5px 0 var(--azul-esc)}
.btn-laranja{background:linear-gradient(180deg,var(--laranja),#b95825);box-shadow:0 5px 0 #8d3e18}
.btn-verde{background:linear-gradient(180deg,var(--verde),var(--verde-esc));box-shadow:0 5px 0 #16512f}

.jogo{min-height:0;display:grid;grid-template-columns:minmax(310px,.92fr) minmax(0,1.08fr);gap:10px}
.painel{min-height:0;background:var(--branco);border:3px solid var(--bege-esc);border-radius:18px;
  box-shadow:0 6px 0 var(--bege-esc),0 12px 24px rgba(94,65,34,.14)}
.controles{padding:10px;display:flex;flex-direction:column;gap:9px;overflow-y:auto}

.mensagem{min-height:46px;display:grid;place-items:center;text-align:center;padding:6px 10px;
  background:#fffaf0;border:3px solid var(--bege);border-radius:14px;
  font-family:"Baloo 2",Nunito,sans-serif;font-size:clamp(17px,2.4vw,22px);line-height:1.05;color:var(--azul-esc)}

.grupo-rotulo{font-size:12px;font-weight:900;text-transform:uppercase;color:#9a704f;margin:1px 0 -3px}
.paleta{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.cor{min-height:46px;border-radius:13px;border:4px solid #fff;
  box-shadow:0 4px 0 rgba(87,63,36,.28),0 7px 14px rgba(94,65,34,.12);
  color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18);font-size:12px}
.cor-clara{color:var(--marrom);text-shadow:none;border-color:var(--bege-esc)}
.carinhas{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.ferramenta{min-height:50px;border-radius:13px;border:4px solid #fff;background:#fffaf0;
  box-shadow:0 4px 0 rgba(87,63,36,.22),0 7px 14px rgba(94,65,34,.10);display:grid;place-items:center;padding:3px}
.ferramenta svg{width:100%;height:100%;max-height:40px;display:block}
.ferramenta.borracha{color:var(--marrom);font-size:12px;font-family:"Baloo 2",Nunito,sans-serif}
.cor[aria-pressed="true"],.ferramenta[aria-pressed="true"]{outline:4px solid var(--marrom);outline-offset:2px;transform:translateY(-2px)}

/* Plaquinha de número */
.num-row{display:flex;align-items:stretch;gap:8px}
.num-input{flex:1;min-width:0;min-height:52px;border-radius:13px;border:3px solid var(--bege-esc);
  background:#fffaf0;text-align:center;color:var(--azul);font-family:"Baloo 2",Nunito,sans-serif;
  font-weight:900;font-size:30px;line-height:1;padding:0 8px}
.num-input:focus{outline:none;border-color:var(--azul)}
.num-input::placeholder{color:#c3ad82;font-size:20px}
.num-row .btn{min-height:52px;padding:0 14px}
.placa-preview{flex:0 0 56px;width:56px;min-height:52px}

.acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:1px}

/* Matriz */
.area{padding:10px;display:grid;place-items:center;min-height:0}
.mesa{width:100%;height:100%;min-height:0;display:grid;place-items:center;padding:8px;overflow:hidden;
  border:3px dashed var(--bege-esc);border-radius:16px;
  background:linear-gradient(0deg,rgba(232,217,184,.22),rgba(232,217,184,.22)),#fffaf0}
.grade-blocos{aspect-ratio:1;height:100%;max-width:100%;
  display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr);gap:3px}
.cel{width:100%;height:100%;padding:0;border:2px solid var(--bege-esc);border-radius:6px;
  background:rgba(255,250,240,.55);position:relative;overflow:hidden}
.cel.pintado{border-color:rgba(255,255,255,.72);box-shadow:inset 0 -5px 0 rgba(0,0,0,.10)}
.cel svg{position:absolute;inset:7%;width:86%;height:86%;pointer-events:none}
.cel.aplicar{animation:pop .22s ease}
@keyframes pop{0%{transform:scale(.82)}60%{transform:scale(1.08)}100%{transform:scale(1)}}

@media (max-width:820px){
  html,body{overflow:auto;height:auto}
  .app{height:auto;min-height:calc(100dvh - 20px)}
  .jogo{grid-template-columns:1fr;grid-template-rows:auto auto}
  .area{order:-1;min-height:52vh}
  .grade-blocos{height:auto;width:min(100%,70vh)}
  .controles{overflow:visible}
}
@media (max-width:430px){
  .carinhas{grid-template-columns:repeat(6,1fr);gap:5px}
  .cor{min-height:44px;font-size:11px}
}
</style>

</head>
<body>
  <main class="app">
    <header class="topo">
      <a class="voltar" href="../jogos.html">&larr; Voltar</a>
      <h1 class="titulo">Blocos e <span>Carinhas</span></h1>
    </header>

    <section class="jogo" aria-label="Jogo de blocos e carinhas">
      <aside class="painel controles">
        <div class="mensagem" id="mensagem" aria-live="polite">Escolha uma cor e pinte os blocos!</div>

        <span class="grupo-rotulo">Cores</span>
        <div class="paleta" id="paleta" aria-label="Escolher cor"></div>

        <span class="grupo-rotulo">Carinhas</span>
        <div class="carinhas" id="carinhas" aria-label="Escolher carinha ou borracha"></div>

        <span class="grupo-rotulo">Plaquinha de número</span>
        <div class="num-row">
          <input class="num-input" id="num-input" type="text" inputmode="numeric" pattern="[0-9]*"
                 maxlength="3" placeholder="0 a 100" aria-label="Digite o número da plaquinha">
          <button class="btn btn-verde" id="gerar-placa" type="button">Gerar</button>
          <button class="ferramenta placa-preview" id="placa-atual" type="button" hidden
                  aria-label="Plaquinha de número atual"></button>
        </div>

        <div class="acoes">
          <button class="btn btn-laranja" id="desfazer" type="button" disabled>Desfazer</button>
          <button class="btn btn-azul" id="limpar" type="button">Limpar tudo</button>
        </div>
      </aside>

      <section class="painel area">
        <div class="mesa">
          <div class="grade-blocos" id="grade" aria-label="Matriz de 10 por 10 blocos"></div>
        </div>
      </section>
    </section>
  </main>

<script>
/* ── Cores ── */
const CORES = [
  {cor:'#C84040', nome:'Vermelho'},{cor:'#D4733A', nome:'Laranja'},
  {cor:'#E8B840', nome:'Amarelo', clara:true},{cor:'#4A9B6F', nome:'Verde'},
  {cor:'#2F7FC0', nome:'Azul'},{cor:'#3752A3', nome:'Anil'},
  {cor:'#7C5AC7', nome:'Violeta'},{cor:'#D963A5', nome:'Rosa'},
  {cor:'#FFFFFF', nome:'Branco', clara:true},{cor:'#202020', nome:'Preto'},
];

/* ── Carinhas (SVG desenhado à mão, originais, sem imagens externas) ──
   Inspiradas em tipos de expressão/emoção: um olho, óculos, coroa, olhos
   quadrados, olho de estrela, cílios, arco-íris, espantado, dentão,
   tímido, sério, bravo, tonto, piscadinha, sorrisão, curioso,
   franzido, língua e calmo. */
function pontosEstrela(cx,cy,rO,rI){
  let p=[];
  for(let i=0;i<10;i++){const r=i%2===0?rO:rI;const a=-Math.PI/2+i*Math.PI/5;
    p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));}
  return p.join(' ');
}
const OLHOS = `
  <circle cx="34" cy="42" r="12" fill="#fff" stroke="#2A1A0A" stroke-width="2.5"/>
  <circle cx="66" cy="42" r="12" fill="#fff" stroke="#2A1A0A" stroke-width="2.5"/>
  <circle cx="34" cy="44" r="5.5" fill="#2A1A0A"/>
  <circle cx="66" cy="44" r="5.5" fill="#2A1A0A"/>`;
function olhoRedondo(cx,cy,r){
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#fff" stroke="#2A1A0A" stroke-width="2.5"/>`
       + `<circle cx="${cx}" cy="${cy+2}" r="${(r*0.46).toFixed(1)}" fill="#2A1A0A"/>`;
}
function olhoQuad(cx,cy,s){
  return `<rect x="${cx-s}" y="${cy-s}" width="${2*s}" height="${2*s}" rx="4" fill="#fff" stroke="#2A1A0A" stroke-width="2.5"/>`
       + `<circle cx="${cx}" cy="${cy+2}" r="${(s*0.42).toFixed(1)}" fill="#2A1A0A"/>`;
}
function olhoEstrela(cx,cy,rO,rI){
  return `<polygon points="${pontosEstrela(cx,cy,rO,rI)}" fill="#F2C94C" stroke="#2A1A0A" stroke-width="2.2" stroke-linejoin="round"/>`
       + `<circle cx="${cx}" cy="${cy}" r="${(rI*0.75).toFixed(1)}" fill="#2A1A0A"/>`;
}
function boca(d){
  return `<path d="${d}" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>`
       + `<path d="${d}" fill="none" stroke="#2A1A0A" stroke-width="5" stroke-linecap="round"/>`;
}
function olhoEspiral(cx,cy){
  let d=`M ${cx} ${cy}`;
  const voltas=2.6, passos=46, rMax=10.5;
  for(let i=1;i<=passos;i++){ const t=i/passos, a=t*voltas*2*Math.PI, r=t*rMax;
    d+=` L ${(cx+r*Math.cos(a)).toFixed(1)} ${(cy+r*Math.sin(a)).toFixed(1)}`; }
  return `<circle cx="${cx}" cy="${cy}" r="13" fill="#fff" stroke="#2A1A0A" stroke-width="2.5"/>`
       + `<path d="${d}" fill="none" stroke="#2A1A0A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>`;
}
const wrap = inner => `<svg viewBox="0 0 100 100">${inner}</svg>`;

const FACES = {
  'um-olho':{ nome:'Um olho', svg: wrap(
    `<circle cx="50" cy="42" r="18" fill="#fff" stroke="#2A1A0A" stroke-width="3"/>`
    + `<circle cx="50" cy="44" r="8" fill="#2A1A0A"/>`
    + boca('M32 66 Q50 84 68 66')) },
  'oculos':{ nome:'Óculos', svg: wrap(
    OLHOS
    + `<circle cx="34" cy="42" r="16" fill="none" stroke="#2A1A0A" stroke-width="3.2"/>`
    + `<circle cx="66" cy="42" r="16" fill="none" stroke="#2A1A0A" stroke-width="3.2"/>`
    + `<path d="M48 42 Q50 39 52 42" fill="none" stroke="#2A1A0A" stroke-width="3.2"/>`
    + boca('M30 64 Q50 82 70 64')) },
  'coroa':{ nome:'Coroa', svg: wrap(
    `<path d="M20 27 L28 13 L38 23 L50 9 L62 23 L72 13 L80 27 Z" fill="#F2C94C" stroke="#2A1A0A" stroke-width="2.5" stroke-linejoin="round"/>`
    + OLHOS + boca('M30 64 Q50 84 70 64')) },
  'quadrado':{ nome:'Quadrado', svg: wrap(
    olhoQuad(34,42,12) + olhoQuad(66,42,12) + boca('M28 62 Q50 80 72 62')) },
  'estrela':{ nome:'Estrela', svg: wrap(
    olhoEstrela(34,42,14,6) + olhoRedondo(66,42,12) + boca('M30 64 Q50 82 70 64')) },
  'cilios':{ nome:'Cílios', svg: wrap(
    `<path d="M26 31 L22 24 M34 29 L34 22 M42 31 L46 24" stroke="#2A1A0A" stroke-width="3" stroke-linecap="round" fill="none"/>`
    + `<path d="M74 31 L78 24 M66 29 L66 22 M58 31 L54 24" stroke="#2A1A0A" stroke-width="3" stroke-linecap="round" fill="none"/>`
    + OLHOS + boca('M30 64 Q50 82 70 64')) },
  'arco-iris':{ nome:'Arco-íris', svg: wrap(
    `<path d="M22 27 A28 21 0 0 1 78 27" fill="none" stroke="#C84040" stroke-width="4.5"/>`
    + `<path d="M28 27 A22 16 0 0 1 72 27" fill="none" stroke="#E8B840" stroke-width="4.5"/>`
    + `<path d="M34 27 A16 11 0 0 1 66 27" fill="none" stroke="#4A9B6F" stroke-width="4.5"/>`
    + olhoRedondo(34,48,10) + olhoRedondo(66,48,10) + boca('M32 68 Q50 84 68 68')) },
  'espantado':{ nome:'Espantado', svg: wrap(
    `<circle cx="34" cy="42" r="14" fill="#fff" stroke="#2A1A0A" stroke-width="2.5"/>`
    + `<circle cx="66" cy="42" r="14" fill="#fff" stroke="#2A1A0A" stroke-width="2.5"/>`
    + `<circle cx="34" cy="44" r="6.5" fill="#2A1A0A"/><circle cx="66" cy="44" r="6.5" fill="#2A1A0A"/>`
    + `<ellipse cx="50" cy="74" rx="8" ry="11" fill="#2A1A0A" stroke="#fff" stroke-width="3"/>`) },
  'dentao':{ nome:'Dentão', svg: wrap(
    olhoQuad(34,42,11) + olhoQuad(66,42,11)
    + `<path d="M28 58 Q50 66 72 58 Q68 86 50 86 Q32 86 28 58 Z" fill="#7a2b2b" stroke="#2A1A0A" stroke-width="3"/>`
    + `<path d="M34 59 Q50 65 66 59 L66 67 Q50 72 34 67 Z" fill="#fff"/>`) },
  'duas-estrelas':{ nome:'Duas estrelas', svg: wrap(
    olhoEstrela(34,42,14,6) + olhoEstrela(66,42,14,6) + boca('M28 62 Q50 84 72 62')) },
  'timido':{ nome:'Tímido', svg: wrap(
    `<rect x="29" y="35" width="16" height="19" rx="7" fill="#fff" stroke="#2A1A0A" stroke-width="2.5"/>`
    + `<rect x="55" y="35" width="16" height="19" rx="7" fill="#fff" stroke="#2A1A0A" stroke-width="2.5"/>`
    + `<circle cx="37" cy="47" r="4.5" fill="#2A1A0A"/><circle cx="63" cy="47" r="4.5" fill="#2A1A0A"/>`
    + `<ellipse cx="26" cy="60" rx="7.5" ry="4.5" fill="#E38A8A" opacity=".55"/>`
    + `<ellipse cx="74" cy="60" rx="7.5" ry="4.5" fill="#E38A8A" opacity=".55"/>`
    + boca('M42 66 Q50 73 58 66')) },
  'serio':{ nome:'Sério', svg: wrap(
    `<path d="M22 29 L45 29" stroke="#2A1A0A" stroke-width="4.5" stroke-linecap="round"/>`
    + `<path d="M55 29 L78 29" stroke="#2A1A0A" stroke-width="4.5" stroke-linecap="round"/>`
    + olhoQuad(34,46,11) + olhoQuad(66,46,11) + boca('M34 68 Q50 74 66 68')) },
  'bravo':{ nome:'Bravo', svg: wrap(
    `<path d="M22 27 L45 37" stroke="#2A1A0A" stroke-width="4.5" stroke-linecap="round"/>`
    + `<path d="M78 27 L55 37" stroke="#2A1A0A" stroke-width="4.5" stroke-linecap="round"/>`
    + olhoQuad(34,48,10) + olhoQuad(66,48,10) + boca('M34 73 Q50 66 66 73')) },
  'tonto':{ nome:'Tonto', svg: wrap(
    olhoEspiral(34,44) + olhoEspiral(66,44)
    + `<path d="M32 68 Q41 62 50 68 Q59 74 68 68" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>`
    + `<path d="M32 68 Q41 62 50 68 Q59 74 68 68" fill="none" stroke="#2A1A0A" stroke-width="5" stroke-linecap="round"/>`) },
  'piscada':{ nome:'Piscadinha', svg: wrap(
    olhoRedondo(34,42,12)
    + `<path d="M56 46 Q66 37 76 46" fill="none" stroke="#2A1A0A" stroke-width="3.5" stroke-linecap="round"/>`
    + boca('M30 62 Q50 82 70 62')) },
  'sorrisao':{ nome:'Sorrisão', svg: wrap(
    olhoRedondo(34,40,12) + olhoRedondo(66,40,12)
    + `<path d="M28 58 Q50 88 72 58 Z" fill="#7a2b2b" stroke="#2A1A0A" stroke-width="3" stroke-linejoin="round"/>`
    + `<path d="M32 60 Q50 66 68 60 Z" fill="#fff"/>`
    + `<ellipse cx="50" cy="78" rx="9" ry="7" fill="#E86A8A"/>`) },
  'curioso':{ nome:'Curioso', svg: wrap(
    `<path d="M24 30 Q34 21 44 30" fill="none" stroke="#2A1A0A" stroke-width="3.5" stroke-linecap="round"/>`
    + `<path d="M56 30 Q66 21 76 30" fill="none" stroke="#2A1A0A" stroke-width="3.5" stroke-linecap="round"/>`
    + olhoRedondo(34,47,12) + olhoRedondo(66,47,12)
    + `<ellipse cx="50" cy="74" rx="6" ry="7.5" fill="#2A1A0A" stroke="#fff" stroke-width="2.5"/>`) },
  'franzido':{ nome:'Franzido', svg: wrap(
    `<path d="M22 34 L34 24 L44 32 L50 26 L56 32 L66 24 L78 34" fill="none" stroke="#2A1A0A" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>`
    + olhoRedondo(34,50,9) + olhoRedondo(66,50,9)
    + boca('M36 71 Q50 66 64 71')) },
  'lingua':{ nome:'Língua', svg: wrap(
    olhoRedondo(34,42,12) + olhoRedondo(66,42,12)
    + `<path d="M32 62 Q50 74 68 62" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round"/>`
    + `<path d="M32 62 Q50 74 68 62" fill="none" stroke="#2A1A0A" stroke-width="5" stroke-linecap="round"/>`
    + `<path d="M46 69 Q45 87 53 87 Q62 87 59 69 Z" fill="#E86A8A" stroke="#2A1A0A" stroke-width="2.5" stroke-linejoin="round"/>`) },
  'calmo':{ nome:'Calmo', svg: wrap(
    `<rect x="30" y="34" width="13" height="22" rx="6.5" fill="#fff" stroke="#2A1A0A" stroke-width="2.5"/>`
    + `<rect x="57" y="34" width="13" height="22" rx="6.5" fill="#fff" stroke="#2A1A0A" stroke-width="2.5"/>`
    + `<circle cx="36.5" cy="46" r="4.5" fill="#2A1A0A"/><circle cx="63.5" cy="46" r="4.5" fill="#2A1A0A"/>`
    + boca('M36 68 Q50 76 64 68')) },
};

/* ── Plaquinha de número (círculo transparente + número preto) ── */
function placaSVG(s){
  const fs = s.length>=3 ? 30 : s.length===2 ? 42 : 54;
  return `<svg viewBox="0 0 100 100">`
    + `<circle cx="50" cy="50" r="42" fill="rgba(255,255,255,.22)" stroke="#2A1A0A" stroke-width="4"/>`
    + `<text x="50" y="52" text-anchor="middle" dominant-baseline="middle" font-family="'Baloo 2',Nunito,sans-serif" `
    +   `font-weight="900" font-size="${fs}" fill="#fff" stroke="#fff" stroke-width="7" paint-order="stroke">${s}</text>`
    + `<text x="50" y="52" text-anchor="middle" dominant-baseline="middle" font-family="'Baloo 2',Nunito,sans-serif" `
    +   `font-weight="900" font-size="${fs}" fill="#2A1A0A">${s}</text>`
    + `</svg>`;
}

/* ── Estado ── */
const N = 100;
const estado = {
  celulas: Array.from({length:N}, () => ({cor:null, face:null, num:null})),
  ferramenta: {tipo:'cor', valor:'#C84040', nome:'Vermelho'},
  historico: [],
};

const grade = document.getElementById('grade');
const paleta = document.getElementById('paleta');
const carinhasBox = document.getElementById('carinhas');
const mensagem = document.getElementById('mensagem');
const desfazer = document.getElementById('desfazer');
const numInput = document.getElementById('num-input');
const placaAtual = document.getElementById('placa-atual');
let celulasDOM = [];
function msg(t){ mensagem.textContent = t; }

/* ── Paletas ── */
CORES.forEach((c,i) => {
  const b = document.createElement('button');
  b.type='button'; b.className='cor'+(c.clara?' cor-clara':''); b.style.background=c.cor;
  b.textContent=c.nome; b.setAttribute('aria-pressed', String(i===0));
  b.addEventListener('click', ()=>escolherFerramenta({tipo:'cor',valor:c.cor,nome:c.nome}, b));
  paleta.appendChild(b);
});
Object.entries(FACES).forEach(([id,f]) => {
  const b = document.createElement('button');
  b.type='button'; b.className='ferramenta'; b.innerHTML=f.svg;
  b.setAttribute('aria-label','Carinha '+f.nome); b.setAttribute('aria-pressed','false');
  b.addEventListener('click', ()=>escolherFerramenta({tipo:'face',valor:id,nome:f.nome}, b));
  carinhasBox.appendChild(b);
});
const borracha = document.createElement('button');
borracha.type='button'; borracha.className='ferramenta borracha'; borracha.textContent='Apagar';
borracha.setAttribute('aria-pressed','false');
borracha.addEventListener('click', ()=>escolherFerramenta({tipo:'apagar',valor:null,nome:'Borracha'}, borracha));
carinhasBox.appendChild(borracha);

const todasFerramentas = [...paleta.children, ...carinhasBox.children, placaAtual];
function escolherFerramenta(f, botao){
  estado.ferramenta=f;
  todasFerramentas.forEach(b=>b.setAttribute('aria-pressed', String(b===botao)));
  if(f.tipo==='cor') msg('Cor '+f.nome+'. Toque nos blocos!');
  else if(f.tipo==='face') msg('Carinha '+f.nome+'. Toque num bloco!');
  else if(f.tipo==='num') msg('Plaquinha '+f.nome+'. Toque num bloco!');
  else msg('Borracha. Toque para apagar.');
}

/* ── Plaquinha: gerar a partir do número digitado ── */
function gerarPlaca(){
  const raw = (numInput.value||'').trim();
  const n = parseInt(raw, 10);
  if(raw==='' || isNaN(n) || n<0){ msg('Digite um número para a plaquinha.'); numInput.focus(); return; }
  const s = String(Math.min(100, n));
  numInput.value = s;
  placaAtual.hidden = false;
  placaAtual.innerHTML = placaSVG(s);
  placaAtual.dataset.num = s;
  placaAtual.setAttribute('aria-label','Plaquinha número '+s);
  escolherFerramenta({tipo:'num', valor:s, nome:s}, placaAtual);
}
document.getElementById('gerar-placa').addEventListener('click', gerarPlaca);
numInput.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); gerarPlaca(); } });
placaAtual.addEventListener('click', ()=>{
  if(placaAtual.dataset.num) escolherFerramenta({tipo:'num', valor:placaAtual.dataset.num, nome:placaAtual.dataset.num}, placaAtual);
});

/* ── Grade ── */
for(let i=0;i<N;i++){
  const cel=document.createElement('button');
  cel.type='button'; cel.className='cel'; cel.dataset.i=i;
  cel.setAttribute('aria-label','Bloco '+(i+1));
  grade.appendChild(cel); celulasDOM.push(cel);
}
grade.addEventListener('click', ev=>{
  const alvo=ev.target.closest('.cel'); if(!alvo) return;
  aplicar(Number(alvo.dataset.i));
});
function renderCel(i){
  const c=estado.celulas[i], el=celulasDOM[i];
  el.classList.toggle('pintado', !!c.cor);
  el.style.background=c.cor||'rgba(255,250,240,.55)';
  el.innerHTML = c.num!=null ? placaSVG(c.num) : (c.face ? FACES[c.face].svg : '');
}
function aplicar(i){
  const c=estado.celulas[i], anterior={cor:c.cor,face:c.face,num:c.num}, f=estado.ferramenta;
  if(f.tipo==='cor') c.cor=f.valor;
  else if(f.tipo==='face'){ c.face=f.valor; c.num=null; }       // um adesivo por bloco
  else if(f.tipo==='num'){ c.num=f.valor; c.face=null; }        // plaquinha substitui a carinha
  else { c.cor=null; c.face=null; c.num=null; }                 // borracha limpa tudo
  if(anterior.cor===c.cor && anterior.face===c.face && anterior.num===c.num) return;
  estado.historico.push({i, anterior});
  renderCel(i);
  const el=celulasDOM[i]; el.classList.remove('aplicar'); void el.offsetWidth; el.classList.add('aplicar');
  atualizarDesfazer();
}
function atualizarDesfazer(){ desfazer.disabled=estado.historico.length===0; }

/* ── Ações ── */
function limparTudo(){
  estado.celulas.forEach((c,i)=>{ c.cor=null; c.face=null; c.num=null; renderCel(i); });
  estado.historico=[]; atualizarDesfazer();
}
desfazer.addEventListener('click', ()=>{
  const passo=estado.historico.pop(); if(!passo) return;
  const c=estado.celulas[passo.i];
  c.cor=passo.anterior.cor; c.face=passo.anterior.face; c.num=passo.anterior.num;
  renderCel(passo.i); atualizarDesfazer(); msg('Tudo bem. Voltamos um passo.');
});
document.getElementById('limpar').addEventListener('click', ()=>{ limparTudo(); msg('Tela limpa. Vamos de novo!'); });

/* ── Início ── */
atualizarDesfazer();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('../service-worker.js'));
}
</script>
</body>
</html>
